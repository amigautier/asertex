<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="keywords"
        content="Sion, Ropa industrial, Dotaciones industriales, Botas industriales, Chalecos reflectivos, Dotaciones industriales Bogotá, Dotaciones industriales Colombia" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Tittle-->
    <title>Asertex Dotaciones Bogotá</title>
    <!--Description-->
    <meta name="description"
        content="Dotaciones empresariales diseñadas para brindar comodidad, resistencia y una presentación profesional. Uniformes y prendas para equipos de trabajo en distintos sectores." />
    <!--Etiqueta Canonical-->
    <link rel="canonical" href="https://asertex.com.co/dotacion" />
    <!--favicon-->
    <link rel="icon" href="images/logotipo/isotipo1.ico" />
    <!--link estilos css-->
    <link rel="stylesheet" href="css/estilos.css">
    <!--Link js para abrir menú-->
    <script src="js/app.js" defer></script>
    <!--Link logos redes sociales-->
    <link rel="stylesheet" href="css/fontello.css" />
    <!-- Link Swiper's CSS-->
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <!--Script efecto scroll-->
    <script src="js/scrollreveal.js"></script>
    <!--Bloquear clic derecho-->
    <script type="text/javascript">
        document.oncontextmenu = function () {
            return false;
        };
    </script>

</head>

<body>

    <!--Header-->
    <div>
        <div id="header-placeholder"></div>
    </div>

    <!--Todo el contenido del cuerpo-->
    <main>
        <!--Slider principal-->
        <section class="contenedor_slider">

            <div class="txtslider" id="txt_slider">
                <h2>Colección de prendas y elementos de protección</h2>
                <p>Fabricamos prendas de dotación de alta calidad</p>
            </div>

            <div class="indicador_bottom_arrow">
                <i class="icon-down-open-big flecha animatedColor" aria-hidden="true" style="color: white;"></i>
            </div>

            <div class="slider" id="slider">

                <div class="slider_section">
                    <a href="#"><img src="images/slider/fondo-botas.jpg" alt="Botas de dotación"></a>
                </div>
                <div class="slider_section" id="slider_section">
                    <a href="#"><img src="images/slider/Chalecos.jpg"
                            alt="Mujer y hombre vistiendo ropa de dotación"></a>
                </div>
                <div class="slider_section">
                    <a href="#"><img src="images/slider/maquina-de-coser.jpg" alt="Máquina de coser"></a>
                </div>

            </div>

            <div class="slider_btn_prev" id="slider_btn_prev">&#60;</div>
            <div class="slider_btn_next" id="slider_btn_next">&#62;</div>

        </section>

        <!--Background frijo-->
        <section class="backgroungfijo">

            <div class="imagen_backfijo" id="imagen_backfijosion">

                <div class="degradado_backfijo">

                    <div class="txt_backfijo">
                        <div class="conttxtbackfijo">
                            <a href="camisa-jean">
                                <h2>Camisa en Jean</h2>
                            </a>
                            <a href="pantalon-jean">
                                <h2 class="P_conttxtbackfijo_1">
                                    Pantalón en Jean
                                </h2>
                            </a>
                            <a href="chaqueta-acolchada">
                                <h2 class="P_conttxtbackfijo_2">
                                    Chaqueta Chaleco acolchado
                                </h2>
                            </a>
                            <a href="chaqueta-enguatada">
                                <h2 class="P_conttxtbackfijo_3">
                                    Chaqueta Enguatada
                                </h2>
                            </a>
                            <a href="chaqueta-jean">
                                <h2 class="P_conttxtbackfijo_4">
                                    Chaqueta en Jean
                                </h2>
                            </a>
                            <a href="botas-seguridad">
                                <h2 class="P_conttxtbackfijo_5">
                                    Botas de Seguridad
                                </h2>
                            </a>
                            <a href="overol">
                                <h2 class="P_conttxtbackfijo_6">
                                    Overol en Drill
                                </h2>
                            </a>
                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- Galería 1 -->

        <div id="galeria-dotacion-placeholder"></div>

        <!-- Galería 2 -->

        <div id="galeria-proteccion-placeholder"></div>

        <!--Imágen-->
        <div class="contenedor_imagen_final">

            <div class="imagen_final">
                <img src="images/backgrounds/fondo-maquina-de-coser.jpg" alt="Hombre cosiendo con maquina de coser">
            </div>

        </div>

        <!--Fondo fijo manometros -->

        <section class="backgroungfijo_4">

            <div class="imagen_backfijo_4">

            </div>

        </section>

    </main>



    <!--Footer-->
    <div>
        <div id="footer-placeholder"></div>
    </div>

    <!--Script js-->
    <script src="includes.js"></script>
    <script src="js/date.js"></script>
    <script src="js/animacionmenu.js"></script>
    <script src="js/slider.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/appcards.js"></script>
    <script src="js/scroll_index.js"></script>

</body>

</html>
